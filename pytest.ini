[pytest]
# Pytest configuration for VADER functional tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers
markers =
    slow: marks tests as slow running (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    cli: marks tests that require CLI installation

# Coverage options (if pytest-cov is installed)
# addopts = --cov=vader --cov-report=html --cov-report=term

# Timeout for tests (if pytest-timeout is installed)
# timeout = 300

# Logging
log_cli = false
log_cli_level = INFO
